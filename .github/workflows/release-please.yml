name: Release Please

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/docs/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish to npm in the SAME run when a release was just created. A release made
  # by the default GITHUB_TOKEN does not trigger `on: release` workflows (GitHub
  # anti-recursion), so the publish is chained here instead of relying on it.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
