name: Publish to npm

on:
  # Auto path: called by the Release Please workflow in the same run, right after it
  # creates a release. A release made by the default GITHUB_TOKEN cannot trigger an
  # `on: release` workflow (GitHub anti-recursion), so we are invoked directly.
  workflow_call:
    inputs:
      tag:
        description: 'Ref/tag to publish. Empty uses the caller ref (main at the release commit).'
        required: false
        type: string
  # Manual fallback: re-publish a specific tag on demand.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. clay-v0.1.0). Leave empty to use the workflow ref.'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        working-directory: packages/clay
        run: npx -y npm@latest publish --access public --provenance
